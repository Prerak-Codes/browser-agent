<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>privacy-agent</title>
  </head>
  <body>

    <h1>
        Privacy-Preserving AI Agent
    </h1>

    <div id="privacyBadge">
        ● Local Processing
    </div>

    <button id="loadModel">
        Load Vision Model
    </button>

    <button id="testImage">
        Test Detection
    </button>

    <button id="runOCR">
        Run OCR
    </button>

    <button id="analyzePrivacy">
        Analyze Privacy
    </button>

    <button id="sanitizeScreen">
        Sanitize Screen
    </button>

    <p id="status">
        Model not loaded
    </p>

    <div id="privacyReport"></div>

    <div id="result"></div>

    <!-- Privacy Policy Panel -->
    <div id="policyPanel">
        <div class="panel-title">
            Privacy Protection
        </div>

        <div class="policy-row">
            <label>Face</label>
            <select id="policyFace">
                <option value="blur">Blur</option>
                <option value="mask">Mask</option>
                <option value="redact">Redact</option>
                <option value="allow">Allow</option>
            </select>
        </div>

        <div class="policy-row">
            <label>Email</label>
            <select id="policyEmail">
                <option value="mask">Mask</option>
                <option value="blur">Blur</option>
                <option value="redact">Redact</option>
                <option value="allow">Allow</option>
            </select>
        </div>

        <div class="policy-row">
            <label>Phone</label>
            <select id="policyPhone">
                <option value="mask">Mask</option>
                <option value="blur">Blur</option>
                <option value="redact">Redact</option>
                <option value="allow">Allow</option>
            </select>
        </div>

        <div class="policy-row">
            <label>Credit Card</label>
            <select id="policyCreditCard">
                <option value="redact">Redact</option>
                <option value="mask">Mask</option>
                <option value="blur">Blur</option>
                <option value="allow">Allow</option>
            </select>
        </div>

        <div class="policy-row">
            <label>Password</label>
            <select id="policyPassword">
                <option value="redact">Redact</option>
                <option value="mask">Mask</option>
                <option value="blur">Blur</option>
                <option value="allow">Allow</option>
            </select>
        </div>

        <div class="policy-row">
            <label>Aadhaar</label>
            <select id="policyAadhaar">
                <option value="mask">Mask</option>
                <option value="blur">Blur</option>
                <option value="redact">Redact</option>
                <option value="allow">Allow</option>
            </select>
        </div>

        <div class="policy-row">
            <label>AI Access</label>
            <button id="aiAccessToggle" class="toggle-btn">
                ON
            </button>
        </div>

        <button id="savePolicy">
            Save Policy
        </button>

        <div id="policyStatus"></div>
    </div>

    <!-- AI Agent Panel -->
    <div id="agentPanel">
        <div class="panel-title">
            AI Agent
        </div>

        <div class="policy-row">
            <label>Task</label>
            <input
                type="text"
                id="agentTask"
                value="Help me fill this application"
            />
        </div>

        <div class="privacy-status">
            <div class="status-item">
                ✓ Local analysis complete
            </div>
            <div class="status-item">
                ✓ Sensitive information protected
            </div>
            <div class="status-item" id="contextStatus">
                ○ Sanitized context not ready
            </div>
        </div>

        <button id="analyzeWithAI">
            Analyze with AI
        </button>

        <div id="agentResult"></div>
    </div>

    <script
        type="module"
        src="/src/main.ts">
    </script>

  </body>
</html>
